    type: HubbardModel
    options: { t: 1.0, U: 4.0, nsites: "8", pbc: false }
  - id: rhf
    type: RHF
    parent: system
    options: { charge: -8, guess_type: hcore }
  - id: ci
    type: CI
    parent: rhf
    slots:
      ci_solver:
        type: CISolver
        options: { active_orbitals: "list(range(8))" }
        slots:
          states: { type: State, options: { nel: 8, multiplicity: 1, ms: 0.0 } }
