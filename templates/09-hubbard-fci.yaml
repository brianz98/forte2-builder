format: forte2-graph/1
forte2_version: "2026.9.1"
order: 9
title: Full CI on a Hubbard chain
summary: Model Hamiltonians plug into the same chain. Here, an open 8-site Hubbard chain at half filling, solved exactly.
tags: [model Hamiltonian, FCI]
source: tests/scf/test_hubbard_model.py
results:
  - { label: "RHF energy", value: "−1.517541" }
  - { label: "FCI energy", value: "−4.235807" }
nodes:
