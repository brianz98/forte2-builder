# Curated catalog for forte2 2026.10.1.
#
# This file holds what can't be read from the code: how classes compose, which
# options matter, and the compatibility rules. Option types, defaults and
# descriptions come from forte2-2026.10.1.dump.json (tools/dump_forte2.py); any
# option listed here overrides the dump field by field. Constructor arguments
# not listed here still appear in the builder, under "Advanced", unless hidden.
#
# Node fields
#   kind       system | method | driver | solver | value | analysis
#   parents    chain nodes this one may follow (any, when omitted)
#   requires   facts the parent must provide; provides: facts this node offers
#   passes     facts forwarded from the parent when it has them
#   sets       attributes set for everything downstream (else inherited)
#   requires_attrs  attributes the parent must have
#   slots      constructor arguments that take another catalog object
#   delegates_to
#              the slot holding the object this node hands its work to; the
#              node must meet that object's requires_attrs and passes on its sets
#   family     types that can replace each other in "Switch to" and fixes
#   exprs      Python expressions offered downstream, keyed by fact ({self} is
#              this node's variable, {parent.<fact>} its upstream's expression);
#              a fact's own expr applies when a node doesn't define one
#   electrons  the charge (and spin) options that fix the electron count, for
#              the parity checks forte2 runs when the node binds to a System
#   call, bind, result, print
#              analysis nodes only: the function or class called after the
#              chain runs, its arguments filled from the upstream node
#              ({parent}, or {parent.<fact>} for one of its expressions), the
#              variable that holds the result, and what to print (false for
#              nothing, else an expression; the result when omitted)
#   rules      extra checks; paths are self.<name>, parent.<name>, and
#              system.<name>, where <name> is type, an option, a slot, an
#              attribute (parent only), provides (parent only), or
#              <slot>.<type|option> for the object in a slot

forte2_version: "2026.10.1"
release:
  tag: v2026.10.1-alpha
  url: https://github.com/evangelistalab/forte2/releases/tag/v2026.10.1-alpha
docs_base: "https://forte2.readthedocs.io/en/latest/autoapi/"

groups:
  system: { label: System, color: slate }
  scf: { label: Mean field, color: blue }
  orbitals: { label: Orbitals, color: teal }
  drivers: { label: Active space, color: violet }
  solvers: { label: Active-space solvers, color: fuchsia }
  correlation: { label: Dynamic correlation, color: orange }
  geometry: { label: Gradients and geometry, color: green }
  analysis: { label: Analysis, color: cyan }
  params: { label: Parameters, color: gray }

facts:
  system: { label: a System }
  mos: { label: orbitals, expr: "{self}.mos.C[0]" }
  occupied_mos: { label: occupied orbitals }
  eps: { label: orbital energies }
  mo_space: { label: an active space }
  energy: { label: an energy }
  gradient: { label: a nuclear gradient }
  ao_density: { label: an AO density matrix }
  iao_density: { label: a density matrix in the IAO basis }

attrs:
  two_component:
    "true": two-component (spinor) orbitals
    "false": one-component orbitals
  model:
    "true": a model Hamiltonian
    "false": a molecular System
  # Set by the solver a driver delegates to; forte2 declares it as the
  # solver's _rdm_orders.
  rdm3:
    "true": a solver that computes 3-RDMs
    "false": a solver without 3-RDMs (selected CI)

nodes:
  # ---------------------------------------------------------------- systems
  System:
    kind: system
    group: system
    import: forte2
    var: system
    summary: A molecule with its basis sets and Hamiltonian.
    provides: [system]
    sets: { two_component: false, model: false }
    card: [basis_set, auxiliary_basis_set, x2c]
    slots:
      x2c: { accepts: [X2CParams] }
    options:
      xyz:
        type: text
        example: "N 0.0 0.0 0.0\nN 0.0 0.0 1.1"
      basis_set:
        type: str
        example: cc-pvdz
        suggest: [sto-3g, 6-31g, cc-pvdz, cc-pvtz, aug-cc-pvdz, def2-svp, def2-tzvp, decon-cc-pvtz]
      auxiliary_basis_set:
        type: str
        example: cc-pvtz-jkfit
        suggest: [def2-universal-jkfit, cc-pvdz-jkfit, cc-pvtz-jkfit, cc-pvqz-jkfit]
      unit: {}
      symmetry: {}
      cholesky_tei: {}
      cholesky_tol: { advanced: true }
      use_gaussian_charges: { advanced: true }
      minao_basis_set:
        type: str
        advanced: true
        doc: The minimal basis used by the SAP guess, AVAS and IAOs.
    rules:
      - require_any: [self.auxiliary_basis_set, self.cholesky_tei]
        field: auxiliary_basis_set
        message: Set auxiliary_basis_set, or turn on cholesky_tei. forte2 has no conventional four-index integrals.
      - when: { self.cholesky_tei: true }
        require: { self.auxiliary_basis_set: { set: false } }
        severity: warning
        field: auxiliary_basis_set
        message: With cholesky_tei, forte2 ignores auxiliary_basis_set.
      - when: { self.jk_mem_thres_mb: { set: true } }
        require: { self.cholesky_tei: false }
        field: jk_mem_thres_mb
        message: jk_mem_thres_mb limits the density-fitted Fock build, so it can't be combined with cholesky_tei.
      - when: { self.jk_mem_thres_mb: { set: true } }
        require_any: [self.auxiliary_basis_set]
        field: jk_mem_thres_mb
        message: jk_mem_thres_mb needs auxiliary_basis_set.

  HubbardModel:
    kind: system
    group: system
    import: forte2
    var: system
    summary: A one- or two-dimensional Hubbard model Hamiltonian.
    provides: [system]
    sets: { two_component: false, model: true }
    card: [nsites, t, U]
    options:
      t: { type: float, example: 1.0 }
      U: { type: float, example: 4.0 }
      nsites: { type: py, example: "8", placeholder: "8, or (4, 4) for 2D" }
      pbc: { type: bool }

  # ------------------------------------------------------------- mean field
  _scf:
    abstract: true
    kind: method
    group: scf
    family: scf
    import: forte2
    parents: [System, HubbardModel]
    provides: [system, mos, eps, energy, ao_density]
    # forte2's own tests use this helper; every SCF class defines it.
    exprs: { ao_density: "{self}._build_total_density_matrix()" }
    electrons: { charge: charge }
    card: [charge]
    options:
      charge: { example: 0 }
      guess_type: { type: enum, values: [minao, hcore] }
      e_tol: {}
      d_tol: {}
      maxiter: {}
      level_shift: { type: float, advanced: true }
      do_diis: { advanced: true }
      diis_start: { advanced: true }
      diis_nvec: { advanced: true }
      diis_min: { advanced: true }
      level_shift_thresh: { advanced: true }
      die_if_not_converged: { advanced: true }
    rules:
      - when: { system.type: HubbardModel }
        require: { self.guess_type: hcore }
        field: guess_type
        message: Model Hamiltonians have no minimal basis for the SAP guess. Use guess_type="hcore".

  _one_component_scf:
    abstract: true
    extends: _scf
    sets: { two_component: false }
    rules:
      - require: { system.x2c.x2c_type: { not: so } }
        message: Spin-orbit X2C needs GHF. Use GHF, or set the System's X2C to x2c_type="sf".

  RHF:
    extends: _one_component_scf
    var: rhf
    summary: Restricted Hartree–Fock for closed-shell molecules.
    provides: [system, mos, occupied_mos, eps, energy, gradient, ao_density]
    exprs: { occupied_mos: "{self}.C[0][:, : {self}.ndocc]" }
    electrons: { charge: charge, closed_shell: true }

  # forte2 defaults ms to None but raises unless it is set, so it is required
  # here.
  ROHF:
    extends: _one_component_scf
    var: rohf
    summary: Restricted open-shell Hartree–Fock.
    electrons: { charge: charge, ms: ms }
    card: [charge, ms]
    options:
      ms: { type: float, required: true }

  UHF:
    extends: _one_component_scf
    var: uhf
    summary: Unrestricted Hartree–Fock.
    provides: [system, mos, eps, energy, gradient, ao_density]
    electrons: { charge: charge, ms: ms }
    card: [charge, ms]
    options:
      ms: { type: float, required: true }
      guess_mix: { advanced: true }

  CUHF:
    extends: _one_component_scf
    var: cuhf
    summary: Constrained unrestricted Hartree–Fock; equivalent to ROHF.
    electrons: { charge: charge, ms: ms }
    card: [charge, ms]
    options:
      ms: { type: float, required: true }
      guess_mix: { advanced: true }

  # GHF has gradient() but, unlike RHF and UHF, doesn't list "gradient" in its
  # provides.
  GHF:
    extends: _scf
    var: ghf
    summary: Generalized (two-component) Hartree–Fock; required for spin-orbit X2C.
    provides: [system, mos, eps, energy, gradient, ao_density]
    sets: { two_component: true }
    electrons: { charge: charge, ms: ms_guess }
    card: [charge]
    options:
      ms_guess: { type: float }
      guess_mix: { advanced: true }
      alpha_beta_mix: { advanced: true }
      break_complex_symmetry: { advanced: true }
      j_adapt: { advanced: true }

  # --------------------------------------------------------------- orbitals
  AVAS:
    kind: method
    group: orbitals
    import: forte2
    var: avas
    summary: Pick an active space by projecting orbitals onto atomic valence orbitals.
    parents: [RHF, ROHF, GHF]
    requires: [mos]
    provides: [system, mos, mo_space]
    requires_attrs: { model: false }
    card: [subspace, selection_method]
    options:
      subspace: { type: "list[str]", example: ["N(2p)"], placeholder: "N(2p), C1-3(2s)" }
      subspace_pi_planes: { type: py, placeholder: '[["C1-3"]]' }
      selection_method: { type: enum, values: [cumulative, cutoff, separate, total] }
      sigma: {}
      cutoff: {}
      num_active: {}
      num_active_docc: {}
      num_active_uocc: {}
      diagonalize: { advanced: true }
      evals_threshold: { advanced: true }
    rules:
      - when: { self.selection_method: total }
        require: { self.num_active: { gt: 0 } }
        field: num_active
        message: selection_method="total" needs num_active greater than 0.
      - when: { self.selection_method: separate, parent.type: { not: ROHF } }
        require_any: [self.num_active_docc, self.num_active_uocc]
        field: num_active_docc
        message: selection_method="separate" needs num_active_docc or num_active_uocc greater than 0.
      - when: { self.selection_method: cumulative }
        require: { self.sigma: { range: [0, 1] } }
        field: sigma
        message: sigma must be between 0 and 1.
      - require_any: [system.minao_basis_set]
        message: AVAS projects onto the minimal basis, so the System needs minao_basis_set.

  ASET:
    kind: method
    group: orbitals
    import: forte2
    var: aset
    summary: Split the active space into a fragment and its environment (ASET(0) embedding).
    parents: [MCOptimizer]
    requires: [mo_space]
    provides: [system, mos, mo_space]
    requires_attrs: { model: false }
    card: [fragment, cutoff_method, cutoff]
    options:
      fragment: { type: "list[str]", example: ["C1-2"], placeholder: "C1-2, H1-3" }
      cutoff_method: { type: enum, values: [threshold, num_of_orbitals] }
      cutoff: {}
      num_A_occ: {}
      num_A_vir: {}
      frozen_core_orbitals: { type: py, advanced: true }
      frozen_virtual_orbitals: { type: py, advanced: true }
    rules:
      - when: { self.cutoff_method: threshold }
        require: { self.cutoff: { range: [0, 1] } }
        field: cutoff
        message: With cutoff_method="threshold", cutoff must be between 0 and 1.

  SpinorUpcaster:
    kind: method
    group: orbitals
    import: forte2
    var: upcaster
    summary: Turn one-component orbitals into spinors so two-component methods can follow.
    requires: [mos]
    provides: [system, mos]
    passes: [mo_space]
    sets: { two_component: true }
    card: [x2c_override]
    slots:
      x2c_override: { accepts: [X2CParams] }
    options:
      apply_random_phase: { advanced: true }
    hide: [rng]
    rules:
      - require: { parent.two_component: false }
        severity: warning
        message: The upstream orbitals are already two-component, so this only applies x2c_override.

  # ----------------------------------------------------------- active space
  _driver:
    abstract: true
    kind: driver
    group: drivers
    family: driver
    import: forte2
    requires: [mos]
    provides: [system, mos, mo_space, energy]
    delegates_to: ci_solver
    slots:
      ci_solver:
        accepts: [CISolver, SelectedCISolver, RelCISolver, RelSelectedCISolver]
        required: true
        positional: true
    rules:
      - when: { self.do_transition_dipole: true }
        require: { parent.model: false }
        field: do_transition_dipole
        message: Transition dipoles need dipole integrals, which a model Hamiltonian doesn't have.
      # The two-component solvers declare no cross-state RDMs.
      - when: { self.do_transition_dipole: true }
        require: { self.ci_solver.type: { not: [RelCISolver, RelSelectedCISolver] } }
        severity: warning
        field: do_transition_dipole
        message: Two-component solvers don't compute transition densities between roots, so forte2 reports only each root's own dipole.

  CI:
    extends: _driver
    var: ci
    summary: Solve the active-space problem once, in the current orbitals.
    card: [ci_solver, final_orbitals]
    options:
      final_orbitals: {}
      do_transition_dipole: {}
      die_if_not_converged: { advanced: true }

  MCOptimizer:
    extends: _driver
    var: mc
    summary: Optimize orbitals and CI coefficients together (CASSCF, GASSCF).
    provides: [system, mos, mo_space, energy, gradient]
    card: [ci_solver, final_orbitals]
    options:
      maxiter: {}
      e_tol: {}
      g_tol: {}
      final_orbitals: {}
      do_transition_dipole: {}
      freeze_inter_gas_rots: { advanced: true }
      active_frozen_orbitals: { type: "list[int]", advanced: true }
      micro_maxiter: { advanced: true }
      max_rotation: { advanced: true }
      die_if_not_converged: { advanced: true }

  _solver:
    abstract: true
    kind: solver
    group: solvers
    family: solver
    import: forte2
    var: ci_solver
    card: [states, nroots, core_orbitals, active_orbitals]
    options:
      nroots:
        type: py
        placeholder: "1, or [1, 2] per state"
        doc: Number of roots, as one integer or one integer per state.
      weights:
        type: py
        placeholder: "[3, 1, 1, 1] or [[1.0], [3.0]]"
        doc: State-averaging weights, as a flat list or one list per state.
      core_orbitals:
        type: py
        placeholder: "4, or [0, 1, 2, 3]"
        doc: Doubly occupied orbitals, as a count or a list of indices.
      active_orbitals:
        type: py
        placeholder: "6, [4, 5, 6], or (3, 3) for GAS"
        doc: Active orbitals, as a count, a list of indices, or one entry per GAS.
      frozen_core_orbitals:
        type: py
        advanced: true
        doc: Frozen core orbitals, as a count or a list of indices.
      frozen_virtual_orbitals:
        type: py
        advanced: true
        doc: Frozen virtual orbitals, as a count or a list of indices.
      die_if_not_converged: { advanced: true }
      do_test_rdms: { advanced: true }
    hide: [log_level, mo_space_override]
    rules:
      - when: { parent.provides: { lacks: mo_space } }
        require_any: [self.active_orbitals, self.core_orbitals, self.frozen_core_orbitals, self.frozen_virtual_orbitals]
        field: active_orbitals
        message: The upstream method doesn't define an active space. Set active_orbitals (and core_orbitals), or add AVAS upstream.

  CISolver:
    extends: _solver
    summary: CI in a complete or generalized active space, in the CSF basis.
    requires_attrs: { two_component: false }
    sets: { rdm3: true }
    slots:
      states: { accepts: [State], required: true, many: true }
      ci_params: { accepts: [CIParams], advanced: true }
      davidson_liu_params: { accepts: [DavidsonLiuParams], advanced: true }
    rules:
      - require: { self.ci_params.ci_algorithm: { not: sparse } }
        field: ci_params
        message: The "sparse" CI algorithm is for two-component solvers only.

  # forte2 also accepts one SelectedCIParams and one DavidsonLiuParams per
  # State, as lists; the builder offers one of each.
  SelectedCISolver:
    extends: _solver
    summary: Heat-bath selected CI; a drop-in replacement for CISolver.
    requires_attrs: { two_component: false }
    sets: { rdm3: false }
    slots:
      states: { accepts: [State], required: true, many: true }
      sci_params: { accepts: [SelectedCIParams] }
      davidson_liu_params: { accepts: [DavidsonLiuParams], advanced: true }

  RelCISolver:
    extends: _solver
    summary: Two-component CI for spin-orbit Hamiltonians.
    requires_attrs: { two_component: true }
    sets: { rdm3: true }
    card: [nel, nroots, core_orbitals, active_orbitals]
    slots:
      states: { accepts: [RelState, State], many: true }
      ci_params: { accepts: [CIParams], advanced: true }
      davidson_liu_params: { accepts: [DavidsonLiuParams], advanced: true }
    options:
      nel:
        type: int
        doc: Number of electrons in the calculation. Use this or states, not both.
    rules:
      - require_one: [self.nel, self.states]
        field: nel
        message: Set nel or add a state, but not both.
      - require: { self.ci_params.ci_algorithm: { not: [kh, knowles-handy] } }
        field: ci_params
        message: The Knowles–Handy CI algorithm is for one-component solvers only. Use "hz", "exact", or "sparse".

  RelSelectedCISolver:
    extends: _solver
    summary: Two-component heat-bath selected CI.
    requires_attrs: { two_component: true }
    sets: { rdm3: false }
    card: [nel, nroots, core_orbitals, active_orbitals]
    slots:
      states: { accepts: [RelState, State], many: true }
      sci_params: { accepts: [SelectedCIParams] }
      davidson_liu_params: { accepts: [DavidsonLiuParams], advanced: true }
    options:
      nel:
        type: int
        doc: Number of electrons in the calculation. Use this or states, not both.
    rules:
      - require_one: [self.nel, self.states]
        field: nel
        message: Set nel or add a state, but not both.

  # ---------------------------------------------------- dynamic correlation
  _dsrg:
    abstract: true
    kind: method
    group: correlation
    family: dsrg
    import: forte2
    var: dsrg
    parents: [CI, MCOptimizer]
    requires: [mo_space]
    provides: [system, mos, mo_space, energy]
    # The 3-cumulant comes from the solver's 3-RDM.
    requires_attrs: { rdm3: true }
    card: [flow_param, relax_reference]
    options:
      flow_param: {}
      relax_reference: { type: enum, values: [false, once, twice, iterate] }
      relax_maxiter: {}
      relax_tol: { advanced: true }
      frozen_core_orbitals:
        type: py
        doc: Orbitals to leave uncorrelated, as a count of the lowest orbitals or a list of indices.
      frozen_virtual_orbitals:
        type: py
        advanced: true
        doc: Virtual orbitals to leave uncorrelated, as a count of the highest orbitals or a list of indices.

  DSRG_MRPT2:
    extends: _dsrg
    summary: Second-order multireference DSRG perturbation theory.
    requires_attrs: { two_component: false }

  RelDSRG_MRPT2:
    extends: _dsrg
    summary: Two-component DSRG-MRPT2 for spin-orbit Hamiltonians.
    requires_attrs: { two_component: true }

  # ------------------------------------------------- gradients and geometry
  FDGradient:
    kind: method
    group: geometry
    import: forte2
    var: fd
    summary: Nuclear gradient of any upstream method, by finite differences of its energy.
    requires: [energy]
    provides: [system, mos, energy, gradient]
    requires_attrs: { model: false }
    card: [step, npoints]
    options:
      step: {}
      npoints: { type: enum, values: [2, 4, 6] }
      root: { type: int }
      project_orbitals: { advanced: true }
      residual_tol: { advanced: true }
    hide: [energy_accessor]
    rules:
      - require: { system.symmetry: false }
        message: Finite differences move the atoms, which forte2 can't do with symmetry=True, because symmetry detection reorients the molecule. Turn off symmetry on the System.
      # root indexes method.E, and every method here reports a single E; the
      # per-root energies need energy_accessor.
      - require: { self.root: { in: [null, 0] } }
        field: root
        message: Every method in the builder reports one energy, so root can only be 0. forte2 picks another root through energy_accessor, which the builder doesn't offer.

  GeometryOptimizer:
    kind: method
    group: geometry
    import: forte2
    var: opt
    summary: Optimize the geometry with L-BFGS, using the upstream method's gradient.
    requires: [gradient]
    provides: []
    requires_attrs: { model: false }
    card: [maxiter, g_tol]
    options:
      root: { type: int }
      maxiter: {}
      g_tol: {}
      max_step: {}
      project_orbitals: { advanced: true }
    hide: [method_factory, lbfgs_kwargs]
    rules:
      - require: { system.symmetry: false }
        message: Geometry optimization moves the atoms, which forte2 can't do with symmetry=True, because symmetry detection reorients the molecule. Turn off symmetry on the System.
      # root reads method.E_ci[root] and calls method.gradient(root=root).
      - when: { self.root: { not: null } }
        require: { parent.type: MCOptimizer }
        field: root
        message: root picks one state of a state-averaged MCOptimizer. Clear root, or follow an MCOptimizer.
      - when: { self.root: { not: null }, parent.type: MCOptimizer }
        require: { parent.final_orbitals: original }
        field: root
        message: Gradients of one root of a state-averaged MCOptimizer need its final_orbitals to be "original".
      - when: { self.root: { not: null }, parent.type: MCOptimizer }
        require: { parent.two_component: false }
        field: root
        message: forte2 has no gradients for one root of a state-averaged two-component MCOptimizer.
      # The analytic gradients: the checks in forte2.gradients.validation and
      # mc_optimizer_grad._validate_casscf_gradient_request.
      - when: { parent.type: { in: [RHF, UHF, GHF, MCOptimizer] } }
        require: { system.cholesky_tei: false }
        message: Analytic gradients need density fitting, not cholesky_tei. Turn off cholesky_tei, or put FDGradient before GeometryOptimizer.
      - when: { parent.type: { in: [RHF, UHF, GHF, MCOptimizer] } }
        require_any: [system.auxiliary_basis_set]
        message: Analytic gradients need the System's auxiliary_basis_set.
      - when: { parent.type: MCOptimizer }
        require: { parent.active_frozen_orbitals: { set: false }, parent.freeze_inter_gas_rots: false }
        message: forte2 has no CASSCF gradients with active_frozen_orbitals or freeze_inter_gas_rots. Clear them, or put FDGradient before GeometryOptimizer.
      - when: { parent.type: MCOptimizer }
        require:
          parent.ci_solver.frozen_core_orbitals: { set: false }
          parent.ci_solver.frozen_virtual_orbitals: { set: false }
        message: forte2 has no CASSCF gradients with frozen orbitals. Clear the solver's frozen orbitals, or put FDGradient before GeometryOptimizer.

  # --------------------------------------------------------------- analysis
  write_orbital_cubes:
    kind: analysis
    group: analysis
    import: forte2
    call: write_orbital_cubes
    var: cubes
    summary: Write orbitals to cube files for viewing in a molecular visualizer.
    requires: [mos]
    requires_attrs: { model: false }
    bind: { system: "{parent}.system", C: "{parent.mos}" }
    card: [indices, prefix]
    options:
      indices: { type: "list[int]", placeholder: "all orbitals" }
      prefix: {}
      filepath: {}
      format:
        type: enum
        values: [cube, 2ccube]
        default: cube
        doc: >-
          The file format. "cube" writes standard cube files; for two-component
          orbitals it writes the alpha and beta magnitudes separately. "2ccube"
          writes the real and imaginary parts of both spin components, for
          two-component orbitals only.
      spacing: { type: float }
      padding: { type: float }
    rules:
      # IBOs are only the occupied orbitals, so writing all of them is fine.
      - when: { parent.type: { not: IBO } }
        require: { self.indices: { set: true } }
        field: indices
        severity: warning
        message: Without indices, this writes a cube file for every orbital.
      - when: { self.format: 2ccube }
        require: { parent.two_component: true }
        field: format
        message: The "2ccube" format needs two-component orbitals.

  get_1e_property:
    kind: analysis
    group: analysis
    import: forte2
    call: get_1e_property
    var: prop
    result: prop
    summary: A one-electron property of the mean-field density, such as the dipole moment.
    requires: [ao_density]
    requires_attrs: { model: false }
    bind: { system: "{parent}.system", g1: "{parent.ao_density}" }
    card: [property_name, unit]
    options:
      property_name:
        type: enum
        values: [dipole, quadrupole, electric_dipole, electric_quadrupole, kinetic_energy, nuclear_attraction_energy]
        example: dipole
        doc: >-
          The property. "dipole" and "quadrupole" include the nuclear
          contribution; "electric_dipole" and "electric_quadrupole" are the
          electronic part only.
      origin: { type: "list[float]", placeholder: "0, 0, 0" }
      unit: { type: enum, values: [debye, au] }

  mulliken_population:
    kind: analysis
    group: analysis
    import: forte2
    call: mulliken_population
    var: populations
    result: populations
    summary: Mulliken populations per basis function and partial charges per atom.
    requires: [ao_density]
    requires_attrs: { model: false, two_component: false }
    bind: { system: "{parent}.system", g1: "{parent.ao_density}" }

  # IAO and IBO take the occupied orbitals of a closed-shell SCF, as in
  # forte2's tests. Both keep .system, so the nodes that follow can bind it.
  IAO:
    kind: analysis
    group: analysis
    import: forte2.orbitals
    call: IAO
    var: iao
    result: iao
    print: false
    summary: Intrinsic atomic orbitals, a minimal basis polarized by the occupied orbitals.
    parents: [RHF]
    requires: [occupied_mos, ao_density]
    provides: [iao_density]
    exprs: { iao_density: "{self}.make_sf_1rdm({parent.ao_density})" }
    requires_attrs: { model: false }
    bind: { system: "{parent}.system", C_occ: "{parent.occupied_mos}" }
    # make_sf_1rdm raises NotImplementedError for j-adapted IAOs.
    hide: [j_adapt]
    rules:
      - require_any: [system.minao_basis_set]
        message: IAOs are built from the minimal basis, so the System needs minao_basis_set.

  iao_partial_charge:
    kind: analysis
    group: analysis
    import: forte2.props
    call: iao_partial_charge
    var: iao_charges
    result: iao_charges
    summary: IAO populations per basis function and partial charges per atom.
    parents: [IAO]
    requires: [iao_density]
    bind: { system: "{parent}.system", g1_iao: "{parent.iao_density}" }

  IBO:
    kind: analysis
    group: analysis
    import: forte2.orbitals
    call: IBO
    var: ibo
    result: ibo
    print: false
    summary: Intrinsic bond orbitals, localized occupied orbitals built from the IAOs.
    parents: [RHF]
    requires: [occupied_mos]
    provides: [mos]
    exprs: { mos: "{self}.C_ibo" }
    requires_attrs: { model: false }
    bind: { system: "{parent}.system", C_occ: "{parent.occupied_mos}" }
    card: [maxiter, g_tol]
    options:
      maxiter: {}
      g_tol: {}
    rules:
      - require_any: [system.minao_basis_set]
        message: IBOs are built from the minimal basis, so the System needs minao_basis_set.

  # Reads spin-dependent 1- and 2-RDMs from ci_solver.sub_solvers, so it
  # needs a one-component solver.
  MutualCorrelationAnalysis:
    kind: analysis
    group: analysis
    import: forte2.props
    call: MutualCorrelationAnalysis
    var: mca
    result: mca
    print: "{self}.mutual_correlation_matrix_summary()"
    summary: Total and orbital-pair mutual correlation, from the active-space 2-cumulant.
    parents: [CI, MCOptimizer]
    requires: [mo_space]
    requires_attrs: { two_component: false }
    bind: { solver: "{parent}" }
    card: [root]
    options:
      root: {}
      sub_solver_index: { advanced: true }

  # ------------------------------------------------------------- parameters
  State:
    kind: value
    group: params
    family: state
    import: forte2
    summary: A target electronic state; electron count, spin and GAS restrictions.
    card: [nel, multiplicity, ms]
    options:
      nel: {}
      system:
        type: system_ref
        example: true
        unless: [nel]
        doc: Take the electron count from the System's nuclear charge minus charge. Ignored when nel is set.
      multiplicity: { example: 1 }
      ms: { example: 0.0 }
      charge: {}
      gas_min: { type: "list[int]", advanced: true }
      gas_max: { type: "list[int]", advanced: true }
      symmetry: { advanced: true }
      symmetry_label: { type: str, advanced: true }
    rules:
      - require_any: [self.nel, self.system]
        field: nel
        message: Set nel, or take the electron count from the System.

  RelState:
    extends: State
    summary: A two-component target state; multiplicity and ms only seed the guess.
    options:
      multiplicity: {}
      ms: {}

  X2CParams:
    kind: value
    group: params
    import: forte2
    summary: Exact two-component relativistic Hamiltonian settings.
    card: [x2c_type, x2c_model, snso_type]
    options:
      x2c_type: { type: enum, values: [sf, so], required: true, example: sf }
      x2c_model: { type: enum, values: ["1e", sap] }
      snso_type: {}
    rules:
      - when: { self.snso_type: { set: true } }
        require: { self.x2c_type: so, self.x2c_model: "1e" }
        field: snso_type
        message: SNSO scaling needs x2c_type="so" and x2c_model="1e".

  CIParams:
    kind: value
    group: params
    import: forte2.base_classes
    summary: CI sigma-builder settings.
    card: [ci_algorithm]
    options:
      ci_algorithm: {}
      ci_builder_memory: {}
      energy_shift: { type: float }

  DavidsonLiuParams:
    kind: value
    group: params
    import: forte2.base_classes
    summary: Davidson–Liu eigensolver settings.
    card: [r_tol, e_tol]
    options:
      guess_per_root: {}
      ndets_per_guess: {}
      collapse_per_root: {}
      basis_per_root: {}
      maxiter: {}
      e_tol: {}
      r_tol: {}
    rules:
      - require: { self.collapse_per_root: { gt: 0 } }
        field: collapse_per_root
        message: collapse_per_root must be at least 1.
      - require: { self.basis_per_root: { gt: self.collapse_per_root } }
        field: basis_per_root
        message: basis_per_root must be greater than collapse_per_root.

  SelectedCIParams:
    kind: value
    group: params
    import: forte2.base_classes
    summary: Heat-bath selected CI settings.
    card: [var_threshold, pt2_threshold, energy_correction]
    options:
      var_threshold: {}
      pt2_threshold: {}
      energy_correction: {}
      maxcycle: {}
      e_tol: {}
      selection_algorithm: {}
      screening_criterion: {}
      guess_occ_window: {}
      guess_vir_window: {}
      ci_algorithm: {}
      do_spin_penalty: {}
      num_batches_per_thread: { advanced: true }
      frozen_creation: { advanced: true }
      frozen_annihilation: { advanced: true }
      energy_shift: { type: float, advanced: true }
      pt2_regularizer: { advanced: true }
      pt2_regularizer_strength: { advanced: true }
    hide: [guess_dets, pinned_guess_dets]
